name: Check the list

on:
  push:
  pull_request:
  schedule:
    - cron: "23 6 * * 1"   # Mondays at 06:23 UTC, in case an ID stops pointing at its journal
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python check_journals.py
